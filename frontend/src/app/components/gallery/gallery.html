<mat-card>
  <mat-card-header>
    <mat-card-title>Gallery</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (loadFailed()) {
      <p class="gallery-message">Could not load the gallery.</p>
    }
    <mat-list>
      @for (art of pixelArts(); track art.id ?? $index) {
        <mat-list-item (click)="loadArt(art)">
          {{ art.name }}
        </mat-list-item>
      } @empty {
        @if (!loadFailed()) {
          <p class="gallery-message">No saved art yet.</p>
        }
      }
    </mat-list>
  </mat-card-content>
</mat-card>
