<mat-card>
  <mat-card-header>
    <mat-card-title>Gallery</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-list>
      @for (art of pixelArts; track art) {
        <mat-list-item (click)="loadArt(art)">
          {{ art.name }}
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
